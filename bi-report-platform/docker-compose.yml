services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi_dev_password
      POSTGRES_DB: bi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
