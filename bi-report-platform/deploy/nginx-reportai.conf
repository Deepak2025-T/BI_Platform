# The public face: the built React app from disk, /api passed to uvicorn.
# Install to /etc/nginx/sites-available/reportai and symlink into sites-enabled.
#
# This listens on a PORT OF ITS OWN (8080), not on 80 or 443, because this server already runs
# another application that owns those. Sharing a port means matching server_name, and a name that
# matches nothing is worse than none: nginx falls through to whichever block is default_server and
# the other app answers instead - which looks exactly like this one failing to deploy. Its own port
# cannot be mistaken, needs no DNS name, and cannot affect the neighbour at all.
#
# setup-from-git.sh writes the port in; NGINX_PORT=9000 sudo bash setup-from-git.sh to change it.
# Whatever it is, the firewall has to allow it:  ufw allow 8080/tcp
#
# For https later, give it a hostname and run certbot: a bare IP cannot have a certificate.

server {
    listen 8080;
    listen [::]:8080;
    # Its own port, so every request to it is meant for this app - no name to match.
    server_name _;

    # Logos and report images people upload.
    client_max_body_size 25m;

    access_log /var/log/nginx/reportai.access.log;
    error_log  /var/log/nginx/reportai.error.log;

    root /opt/ReportAI/frontend/dist;
    index index.html;

    # The app is a single page with client-side routing: every unknown path is index.html,
    # or a reload of /reports/114 would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite writes content-hashed filenames, so these can be cached hard. index.html must not be,
    # or a browser keeps loading yesterday's bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Building a wide dashboard is one request that can run for the best part of half an hour
        # (AI_DASHBOARD_MAX_SECONDS is 1500). nginx's default 60s would cut it off at the first
        # chart, so the whole chain gets room: request, response, and the buffering in between.
        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
        proxy_buffering off;
    }
}
